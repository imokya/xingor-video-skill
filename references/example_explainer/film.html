<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AI 接龙</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #8a93b0; font: 12px -apple-system, sans-serif; }
  #stage { position: absolute; inset: 0 0 40px 0; display: flex; align-items: center; justify-content: center; }
  #c { max-width: 100%; max-height: 100%; display: block; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; gap: 10px; align-items: center; padding: 0 12px; background: #0a0c14; }
  #bar input[type=range] { flex: 1; }
  #bar button { background: #1a1e2c; color: #cfd6ee; border: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="play">播放</button>
  
  <input id="scrub" type="range" min="0" value="0" step="1">
  <span id="time">0.00s</span>
</div>
<script type="module" src="film.js"></script>
</body>
</html>
